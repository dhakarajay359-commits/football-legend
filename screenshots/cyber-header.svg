<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyberGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0,229,255,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    @keyframes scan { 0% { transform: translateY(0px); } 100% { transform: translateY(220px); } }
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .scanline { animation: scan 3.5s linear infinite; }
    .shield { animation: pulse 2.4s ease-in-out infinite; }
    .cursor { animation: blink 1s step-end infinite; }
  </style>

  <rect width="900" height="220" rx="14" fill="url(#bgGrad)"/>
  <rect width="900" height="220" rx="14" fill="url(#grid)"/>
  <rect class="scanline" x="0" y="0" width="900" height="3" fill="rgba(0,229,255,0.35)"/>

  <!-- Animated Cyber Shield -->
  <g class="shield" transform="translate(740, 48)">
    <path d="M55 8 L100 24 L100 62 C100 94 55 116 55 116 C55 116 10 94 10 62 L10 24 Z" fill="rgba(0,229,255,0.08)" stroke="url(#cyberGlow)" stroke-width="2.5"/>
    <path d="M55 24 L84 35 L84 60 C84 82 55 98 55 98 C55 98 26 82 26 60 L26 35 Z" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="55" cy="60" r="10" fill="#00e5ff"/>
  </g>

  <!-- Terminal Header & Info -->
  <circle cx="34" cy="28" r="5" fill="#ef4444"/>
  <circle cx="52" cy="28" r="5" fill="#facc15"/>
  <circle cx="70" cy="28" r="5" fill="#22c55e"/>
  <text x="90" y="32" font-family="monospace" font-size="12" fill="#64748b">root@ajay-dhakar:~# ./init_profile.sh</text>

  <text x="34" y="88" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="40" fill="#f8fafc">AJAY DHAKAR</text>
  <text x="34" y="122" font-family="monospace" font-weight="700" font-size="16" fill="#00e5ff">Web Developer  •  3D Game Engineer  •  Cybersecurity Enthusiast</text>
  <text x="34" y="156" font-family="monospace" font-size="13" fill="#22c55e">&gt; [STATUS] Building 3D Games (Three.js / Unity 6) &amp; Secure Full-Stack Apps</text>
  <text x="34" y="182" font-family="monospace" font-size="13" fill="#94a3b8">&gt; [SECURITY] Authoritative Servers • Input Validation • Anti-Cheat</text>
  <rect class="cursor" x="530" y="170" width="8" height="14" fill="#00e5ff"/>
</svg>
